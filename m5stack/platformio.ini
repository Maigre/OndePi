; PlatformIO Project Configuration for OndePi M5Stack Interface
; M5Stack Core Basic (ESP32)

[env:m5stack-core]
platform = espressif32
board = m5stack-core-esp32
framework = arduino
monitor_speed = 115200

lib_deps =
    m5stack/M5Unified@^0.2.2
    bblanchon/ArduinoJson@^7.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_M5STACK_CORE_ESP32

; Upload settings
upload_speed = 921600
