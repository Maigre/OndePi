[general]
log_level = "info"
reconnect = true
buffer_seconds = 5
retry_initial_delay_seconds = 3
retry_max_delay_seconds = 30
retry_max_attempts = 0

[input]
# ALSA device string, e.g. hw:3,0 or plughw:1,0
alsa_device = "hw:3,0"
sample_rate = 44100
bits_per_sample = 16
channels = 2
limiter_enabled = true
limiter_drive = 1.5
# Capture block size in frames. Leave 0 (auto) — forcing a value (e.g. 2048)
# was measured to CAUSE input overflows/clicks on a Pi 3B+.
blocksize = 0
# Capture latency buffer: "low" | "high" | seconds. Bigger absorbs scheduling
# jitter and prevents input-overflow clicks. "high" was only ~34 ms on a Pi
# 3B+; 0.3 s is a safe default. Raise to 0.5 if clicks persist under load.
latency = 0.3

[stream]
format = "mp3" # mp3|aac|opus
bitrate_kbps = 256
bitrate_mode = "cbr" # cbr|vbr
server = "icecast.example.com"
port = 8000
mount = "live"
tls = true
username = "source"
password = "change-me"
icy = true

[metadata]
name = "Live Source"
description = "Live input"
genre = "Live"
public = false

[web]
bind = "0.0.0.0"
port = 8090

[serial]
# "auto" to auto-detect M5Stack, or explicit path e.g. /dev/ttyUSB0, /dev/ttyACM0
port = "auto"
baudrate = 115200

[webradio]
# URL of a web radio stream to play when not monitoring input
url = ""
